<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found – KM Media Ventures Portfolio</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    p {
      font-size: 1.2rem;
      max-width: 500px;
      margin-bottom: 30px;
      opacity: 0.85;
    }

    a {
      display: inline-block;
      padding: 12px 28px;
      font-size: 1.1rem;
      color: #ffffff;
      background: transparent;
      border: 2px solid #ffffff;
      border-radius: 6px;
      text-decoration: none;
      transition: 0.3s ease;
    }

    a:hover {
      background: #ffffff;
      color: #0d0d0d;
    }

    .fade-in {
      animation: fadeIn 1.2s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <h1 class="fade-in">404</h1>
  <p class="fade-in" style="animation-delay: 0.3s;">
    The page you’re looking for doesn’t exist or has been moved.
  </p>
  <a class="fade-in" style="animation-delay: 0.6s;" href="https://kmmediaventures.github.io/portfolio/">
    Return to Homepage
  </a>
</body>
</html>
